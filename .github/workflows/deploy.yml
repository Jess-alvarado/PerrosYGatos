name: Git Push Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Download the latest version of the code
        uses: actions/checkout@v4

      - name: Grant execute permission for maven wrapper
        run: |
          chmod +x backend/pyg-auth/mvnw
          chmod +x backend/pyg-owner/mvnw
          chmod +x backend/pyg-professional/mvnw

      - name: Run unit tests
        env:
          SPRING_PROFILES_ACTIVE: test
          
          JWT_SECRET: dGVzdFNlY3JldEtleVBhcmFQcnVlYmFzUHlnQXV0aDEyMzQ1Njc4OTA=
          JWT_EXPIRATION: 3600000
          JWT_REFRESH_EXPIRATION: 604800000
          
          AUTH_SERVICE_URL: http://localhost:8080
        run: |
          cd $GITHUB_WORKSPACE/backend/pyg-auth && ./mvnw test
          cd $GITHUB_WORKSPACE/backend/pyg-owner && ./mvnw test
          cd $GITHUB_WORKSPACE/backend/pyg-professional && ./mvnw test

      - name: Deploy with Docker Compose
        run: |
          cd $GITHUB_WORKSPACE
          docker compose down
          docker compose up -d --build
