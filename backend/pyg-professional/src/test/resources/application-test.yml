spring:
  application:
    name: pyg-professional-test

  mvc:
    hiddenmethod:
      filter:
        enabled: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        '[format_sql]': false

server:
  port: 8083
  error:
    include-message: always

jwt:
  secret: dGVzdFNlY3JldEtleVBhcmFQcnVlYmFzUHlnQXV0aDEyMzQ1Njc4OTA=
  expiration: 3600000

logging:
  level:
    root: ERROR
    '[com.professional.pyg_professional]': DEBUG
    '[org.springframework.web]': ERROR
    '[org.hibernate.SQL]': ERROR
    '[org.hibernate.type.descriptor.sql.BasicBinder]': ERROR
    '[feign]': ERROR

auth:
  service:
    url: http://localhost:8081

feign:
  client:
    config:
      default:
        connectTimeout: 1000
        readTimeout: 1000
        loggerLevel: NONE

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: true
  packages-to-scan: com.professional.pyg_professional.controllers