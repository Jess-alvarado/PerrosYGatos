spring:
  application:
    name: pyg-owner-test
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': false
        dialect: org.hibernate.dialect.H2Dialect
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

server:
  port: 8082
  error:
    include-message: always

jwt:
  secret: dGVzdFNlY3JldEtleVBhcmFQcnVlYmFzUHlnQXV0aDEyMzQ1Njc4OTA=
  expiration: 3600000

logging:
  level:
    root: ERROR
    '[com.owner.pyg_owner]': DEBUG
    '[org.springframework.web]': ERROR
    '[org.hibernate.SQL]': ERROR
    '[org.hibernate.type.descriptor.sql.BasicBinder]': ERROR
    '[feign]': ERROR

auth:
  service:
    url: http://localhost:8081

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: NONE

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

JWT_SECRET: dGVzdFNlY3JldEtleVBhcmFQcnVlYmFzUHlnQXV0aDEyMzQ1Njc4OTA=
JWT_EXPIRATION: 3600000
JWT_REFRESH_EXPIRATION: 604800000