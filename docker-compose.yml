version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-perrosygatos}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  pyg-auth:
    build:
      context: ./backend/pyg-auth
    container_name: pyg-auth
    environment:
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME_AUTH}
      - SPRING_DATASOURCE_URL=${AUTH_DATABASE_URL:-jdbc:postgresql://postgres:5432/pyg_auth}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${DB_DRIVER}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - SPRING_JPA_FORMAT_SQL=${SPRING_JPA_FORMAT_SQL}
      - SPRING_JPA_OPEN_IN_VIEW=${SPRING_JPA_OPEN_IN_VIEW}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - SERVER_PORT=${SERVER_PORT_AUTH}
      - LOG_LEVEL=${LOG_LEVEL}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL}
      - SPRING_LOG_LEVEL=${SPRING_LOG_LEVEL}
      - HIBERNATE_SQL_LOG_LEVEL=${HIBERNATE_SQL_LOG_LEVEL}
      - HIBERNATE_BINDER_LOG_LEVEL=${HIBERNATE_BINDER_LOG_LEVEL}
      - AUTH_SERVICE_URL=http://pyg-auth:8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy

  pyg-owner:
    build:
      context: ./backend/pyg-owner
    container_name: pyg-owner
    environment:
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME_OWNER}
      - SPRING_DATASOURCE_URL=${OWNER_DATABASE_URL:-jdbc:postgresql://postgres:5432/pyg_owner}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${DB_DRIVER}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - SPRING_JPA_PROPERTIES_FORMAT_SQL=${SPRING_JPA_PROPERTIES_FORMAT_SQL}
      - SPRING_JPA_OPEN_IN_VIEW=${SPRING_JPA_OPEN_IN_VIEW}
      - AUTH_SERVICE_URL=http://pyg-auth:8081
      - SERVER_PORT=${SERVER_PORT_OWNER}
      - LOG_LEVEL=${LOG_LEVEL}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL}
      - SPRING_LOG_LEVEL=${SPRING_LOG_LEVEL}
      - HIBERNATE_SQL_LOG_LEVEL=${HIBERNATE_SQL_LOG_LEVEL}
      - HIBERNATE_BINDER_LOG_LEVEL=${HIBERNATE_BINDER_LOG_LEVEL}
      - FEIGN_CONNECT_TIMEOUT=${FEIGN_CONNECT_TIMEOUT}
      - FEIGN_READ_TIMEOUT=${FEIGN_READ_TIMEOUT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_started
      pyg-auth:
        condition: service_started

  pyg-professional:
    build:
      context: ./backend/pyg-professional
    container_name: pyg-professional
    environment:
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME_PROFESSIONAL}
      - SPRING_DATASOURCE_URL=${PROFESSIONAL_DATABASE_URL:-jdbc:postgresql://postgres:5432/pyg_professional}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${DB_DRIVER}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - SPRING_JPA_FORMAT_SQL=${SPRING_JPA_FORMAT_SQL}
      - SPRING_JPA_OPEN_IN_VIEW=${SPRING_JPA_OPEN_IN_VIEW}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://pyg-auth:8081}
      - SERVER_PORT=${SERVER_PORT_PROFESSIONAL}
      - LOG_LEVEL=${LOG_LEVEL}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL}
      - SPRING_LOG_LEVEL=${SPRING_LOG_LEVEL}
      - HIBERNATE_SQL_LOG_LEVEL=${HIBERNATE_SQL_LOG_LEVEL}
      - HIBERNATE_BINDER_LOG_LEVEL=${HIBERNATE_BINDER_LOG_LEVEL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_started
      pyg-auth:
        condition: service_started

  pyg-gateway:
    build:
      context: ./backend/pyg-gateway
    container_name: pyg-gateway
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT_GATEWAY}
      - AUTH_SERVICE_URL=http://pyg-auth:${SERVER_PORT_AUTH}
      - OWNER_SERVICE_URL=http://pyg-owner:${SERVER_PORT_OWNER}
      - PROFESSIONAL_SERVICE_URL=http://pyg-professional:${SERVER_PORT_PROFESSIONAL}
      - BEHAVIOR_CASE_SERVICE_URL=http://pyg-behavior-case:${SERVER_PORT_BEHAVIOR_CASE}
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - "9090:9090"
    depends_on:
      pyg-auth:
        condition: service_started
      pyg-owner:
        condition: service_started
      pyg-professional:
        condition: service_started
      pyg-behavior-case:
        condition: service_started
      redis:
        condition: service_healthy

  pyg-frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: pyg-frontend
    ports:
      - "80:80"
    depends_on:
      pyg-gateway:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: pyg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: pyg-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    depends_on:
      pyg-auth:
        condition: service_started
      pyg-owner:
        condition: service_started
      pyg-professional:
        condition: service_started
      pyg-gateway:
        condition: service_started
      pyg-behavior-case:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: pyg-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      prometheus:
        condition: service_started

  pyg-behavior-case:
    build:
      context: ./backend/pyg-behavior-case
    container_name: pyg-behavior-case
    environment:
      - SPRING_APPLICATION_NAME_BEHAVIOR_CASE=pyg-behavior-case
      - BEHAVIOR_CASE_DATABASE_URL=jdbc:postgresql://postgres:5432/pyg_behavior_case
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${DB_DRIVER}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - SPRING_JPA_PROPERTIES_FORMAT_SQL=${SPRING_JPA_PROPERTIES_FORMAT_SQL}
      - SPRING_JPA_OPEN_IN_VIEW=${SPRING_JPA_OPEN_IN_VIEW}
      - SERVER_PORT_BEHAVIOR_CASE=8084
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL}
      - SPRING_LOG_LEVEL=${SPRING_LOG_LEVEL}
      - HIBERNATE_SQL_LOG_LEVEL=${HIBERNATE_SQL_LOG_LEVEL}
      - HIBERNATE_BINDER_LOG_LEVEL=${HIBERNATE_BINDER_LOG_LEVEL}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_started
      pyg-auth:
        condition: service_started
volumes:
  pgdata: